# FORK ONLY - never part of a pull request to storytold/filmcraft.
#
# Test builds of every desktop platform, unsigned, from the same packaging scripts as release.yml
# (storytold/craft-common-actions) minus code signing and notarization: Windows x64 and arm64,
# macOS universal (ad-hoc signed), Linux x86_64 and aarch64 (AppImage, deb, rpm, tar.gz). Plus quick
# checks of the code the fork changes.
#
# Runs on every push to the `win-test` branch (and by hand from the Actions tab). When every build
# succeeds, the files are published as the pre-release "test-build" of the fork, a public page
# anyone can download from without a GitHub account:
# https://github.com/hugomec7/filmcraft/releases/tag/test-build
name: Test builds

on:
  push:
    # win-test: the test builds; ci/*: only the checks, for a pull request branch before it is opened
    branches: [win-test, "ci/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-builds-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  FILMCRAFT_BUILD_SHA: ${{ github.sha }}

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    if: github.ref == 'refs/heads/win-test'
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc }
          - { arch: arm64, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out craft-fonts
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: abb83316d96aa59c1cf64784289e378fe9fa5695
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: test-windows-${{ matrix.arch }}
      - name: Install WiX
        uses: storytold/craft-common-actions/actions/install-wix@main
        with:
          wix-version: "5.0.2"
      - name: Build and package (unsigned)
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: filmcraft-windows-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  macos:
    name: macOS universal
    # GitHub's Apple-silicon runners are often out of capacity; the Intel one builds the same
    # universal app (both architectures are cross-compiled)
    if: github.ref == 'refs/heads/win-test'
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out craft-fonts
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: abb83316d96aa59c1cf64784289e378fe9fa5695
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: test-macos-universal
      - name: Build and package (ad-hoc signed, not notarized)
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/macos/package.sh --arch universal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: filmcraft-macos
          path: dist/release/*
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    if: github.ref == 'refs/heads/win-test'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04, deb: amd64 }
          - { arch: aarch64, runner: ubuntu-22.04-arm, deb: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out craft-fonts
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: abb83316d96aa59c1cf64784289e378fe9fa5695
      - uses: storytold/craft-common-actions/actions/install-linux-deps@main
        with:
          deb-arch: ${{ matrix.deb }}
          nfpm-version: "2.47.0"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: test-linux-${{ matrix.arch }}
      - name: Build and package (AppImage, deb, rpm, tar.gz)
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/linux/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: filmcraft-linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  # The files of every build on one public page (replaced on each run).
  publish:
    name: Publish the test-build pre-release
    needs: [windows, macos, linux]
    # publish what was built even when a runner was not available (the macOS queue)
    if: ${{ !cancelled() && github.ref == 'refs/heads/win-test' && needs.windows.result == 'success' && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # the release description (patch notes and the full list of changes) is .github/test-build-notes.md
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/test-build-notes.md
          sparse-checkout-cone-mode: false
          path: src
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Replace the test-build pre-release
        run: |
          ls -la dist
          gh release delete test-build --cleanup-tag --yes || true
          {
            echo "Branch \`win-test\`, commit \`${GITHUB_SHA::7}\`, built $(date -u +'%Y-%m-%d %H:%M UTC')."
            echo
            cat src/.github/test-build-notes.md
          } > notes.md
          gh release create test-build dist/* --prerelease --target "$GITHUB_SHA" --title "FilmCraft test build (${GITHUB_SHA::7})" --notes-file notes.md

  # Quick checks of the parts the fork changes. Errors are also written as annotations (shown on
  # the run's Summary page), so they can be read without opening the logs.
  checks:
    name: Checks (compile, fmt, clippy, settings and timeline tests)
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: test-windows-x64-checks
      - name: Format
        run: |
          cargo fmt --all --check > fmt.log 2>&1 || { grep -E '^Diff in' fmt.log | head -10 | sed 's/^/::error::/'; exit 1; }
      - name: Compile (all targets of engine and UI)
        id: compile
        if: always()
        run: |
          set -o pipefail
          cargo clippy -p filmcraft-engine -p filmcraft-ui-egui -p filmcraft --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.log \
            || { grep -E '(error|warning)(\[[A-Za-z0-9_:-]+\])?:' clippy.log | grep -v 'could not compile\|aborting due to' | head -40 | sed 's/^/::error::/'; exit 1; }
      - name: Engine settings tests
        if: always() && steps.compile.outcome == 'success'
        run: |
          set -o pipefail
          cargo test -p filmcraft-engine --lib settings 2>&1 | tee t1.log || { grep -E "panicked at|^test .* FAILED|assertion" t1.log | head -40 | sed 's/^/::error::/'; exit 1; }
      - name: UI tests (wheel, settings)
        if: always() && steps.compile.outcome == 'success'
        run: |
          set -o pipefail
          cargo test -p filmcraft-ui-egui --test it -- timeline_scroll_ui settings_ui timeline_option_drag_ui view_ui timeline_middle_pan_ui workspaces_ui monitor_wheel_ui 2>&1 | tee t2.log \
            || { grep -E "panicked at|^test .* FAILED|assertion|error(\[E[0-9]+\])?:" t2.log | head -40 | sed 's/^/::error::/'; exit 1; }
      - name: UI unit tests
        if: always() && steps.compile.outcome == 'success'
        run: |
          set -o pipefail
          cargo test -p filmcraft-ui-egui --lib 2>&1 | tee t3.log || { grep -E "panicked at|^test .* FAILED|assertion" t3.log | head -40 | sed 's/^/::error::/'; exit 1; }
