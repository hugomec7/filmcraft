# FORK ONLY - never part of a pull request to storytold/filmcraft.
#
# A quick test build: only Windows x64, unsigned, no macOS / Linux / web / Flatpak / FreeBSD.
# It runs the same steps as the Windows x64 job of release.yml (storytold/craft-common-actions),
# so the installer is built the same way as an official one, minus code signing.
#
# Runs on every push to the `win-test` branch (and by hand from the Actions tab once this file is
# on the fork's default branch). The files appear under "Artifacts" on the run's page.
name: Windows x64 test

on:
  push:
    branches: [win-test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-x64-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 (test build)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      FILMCRAFT_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out craft-fonts
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: abb83316d96aa59c1cf64784289e378fe9fa5695
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: test-windows-x64
      - name: Install WiX
        uses: storytold/craft-common-actions/actions/install-wix@main
        with:
          wix-version: "5.0.2"
      - name: Build and package (unsigned)
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: ./packaging/windows/package.ps1 -Arch x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: filmcraft-windows-x64-test
          path: dist/release/*
          if-no-files-found: error
